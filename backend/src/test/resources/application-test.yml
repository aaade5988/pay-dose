# 测试配置：SQLite 临时文件库
#
# 隔离策略说明：
# 1. 用 `${random.uuid}` 让每个 ApplicationContext 拿到独立的库文件
# 2. 各测试类用 @DirtiesContext 强制各自的上下文互不复用
#
# 早期尝试过 `:memory:&cache=shared`，但 SQLite 的 shared-cache 内存库在同一
# JVM 内仍会串，且 Hibernate 的 create-drop 行为不稳定，故改用文件库。
spring:
  datasource:
    url: jdbc:sqlite:${java.io.tmpdir}/pay-dose-test-${random.uuid}.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
  jackson:
    default-property-inclusion: always

logging:
  level:
    root: WARN
    com.dose.pay: INFO
